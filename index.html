<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Кибер Кликер ⚡</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-grad: radial-gradient(circle at 50% 50%, #121225 0%, #070712 100%);
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
        }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg-grad);
            color: #ffffff; text-align: center; margin: 0; padding: 15px; user-select: none;
        }
        .stats-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; }
        .stat-card {
            background: var(--card-bg); border: 1px solid var(--card-border); padding: 10px 4px;
            border-radius: 14px; font-size: 11px; font-weight: 600;
        }
        #click-power { color: #00f2fe; }
        #cps-view { color: #ff007f; }
        #crystals-view { color: #00ff87; font-weight: bold; }
        .counter { font-size: 40px; font-weight: 900; margin: 10px 0; word-break: break-all; }
        .tap-btn {
            width: 140px; height: 140px; border-radius: 50%; border: none;
            background: radial-gradient(circle at 30% 30%, #00f2fe 0%, #4facfe 100%); color: white;
            font-size: 20px; font-weight: 800; cursor: pointer; box-shadow: 0 0 30px rgba(0, 242, 254, 0.4);
        }
        .tap-btn:active { transform: scale(0.92); }
        .promo-box { background: var(--card-bg); border: 1px solid var(--card-border); padding: 10px; border-radius: 14px; margin: 15px 0; display: flex; gap: 8px; }
        .promo-input { flex: 1; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--card-border); border-radius: 10px; color: #fff; padding: 8px; text-align: center; font-weight: bold; }
        .promo-btn { background: #00f2fe; color: #000; border: none; border-radius: 10px; font-weight: 800; padding: 0 14px; cursor: pointer; }
        
        .shop-section { margin-top: 15px; text-align: left; }
        .shop-title { font-size: 14px; font-weight: bold; color: #a5b4fc; margin-bottom: 8px; }
        .shop-grid { display: flex; flex-direction: column; gap: 8px; max-height: 25vh; overflow-y: auto; }
        .shop-btn {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06); color: white;
            padding: 10px; font-size: 12px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center;
        }
        .shop-btn .cost { color: #00ff87; font-weight: bold; }
        .shop-btn:disabled { opacity: 0.3; }
    </style>
</head>
<body>
    <div class="stats-container">
        <div class="stat-card" id="click-power">👆 Клик: +1</div>
        <div class="stat-card" id="cps-view">⚙️ Авто: 0/с</div>
        <div class="stat-card" id="crystals-view">💎 Алмазы: 0</div>
    </div>

    <div class="counter" id="exp-counter">0 XP</div>
    <button class="tap-btn" onclick="tap()">💎 АЛМАЗ</button>

    <div class="promo-box">
        <input type="text" id="promo-code" class="promo-input" placeholder="КОД НА XP..." />
        <button class="promo-btn" onclick="usePromo()">ВВОД</button>
    </div>

    <div class="shop-section">
        <div class="shop-title">👆 ПРОКАЧКА КЛИКА</div>
        <div class="shop-grid" id="click-shop"></div>
    </div>

    <div class="shop-section">
        <div class="shop-title">📦 АВТО-ТАПЕРЫ</div>
        <div class="shop-grid" id="auto-shop"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        
        // Загрузка состояния
        let exp = Number(localStorage.getItem("exp")) || 0;
        let clickPower = Number(localStorage.getItem("clickPower")) || 1;
        let autoCps = Number(localStorage.getItem("autoCps")) || 0;
        let crystals = Number(localStorage.getItem("crystals")) || 0;
        let lastLeave = Number(localStorage.getItem("lastLeave")) || Date.now();
        let maxOfflineHours = Number(localStorage.getItem("maxOfflineHours")) || 1;
        let boughtIds = JSON.parse(localStorage.getItem("boughtIds") || "[]");
        let usedPromos = JSON.parse(localStorage.getItem("usedPromos") || "[]");

        // Расчёт офлайн-дохода
        const now = Date.now();
        const secondsAway = Math.floor((now - lastLeave) / 1000);
        if (autoCps > 0 && secondsAway > 5) {
            const maxSec = maxOfflineHours * 3600;
            const actualSec = Math.min(secondsAway, maxSec);
            const gained = actualSec * autoCps;
            exp += gained;
            alert(`💤 Пока вас не было (${actualSec} сек), получено: +${gained} XP!`);
        }

        const promoCodes = {
            "PROMOKOD": 100, "PROCLIKER": 100, "BONUS100": 100, "GEMSTART": 100, "LUCKY100": 100,
            "SILVERPASS": 1000, "MEGASECRET": 1000, "SUPERGEM2026": 1000,
            "GOLDENKING": 10000, "CYBERLEGEND2026": 100000
        };

        const clickUpgrades = [
            { id: 101, name: "Клик +1", cost: 50, power: 1 },
            { id: 102, name: "Клик +5", cost: 250, power: 5 },
            { id: 103, name: "Клик +25", cost: 1250, power: 25 },
            { id: 104, name: "Клик +100", cost: 5000, power: 100 }
        ];

        const autoUpgrades = [
            { id: 1, name: "Палка", cost: 100, cps: 10 },
            { id: 2, name: "Ручка", cost: 500, cps: 50 },
            { id: 8, name: "Офлайн 2 часа", cost: 1000, cps: 0, time: 2 },
            { id: 16, name: "Офлайн 4 часа", cost: 50000, cps: 0, time: 4 }
        ];

        function formatNum(num) { return num.toLocaleString('ru-RU'); }

        function saveLocal() {
            localStorage.setItem("exp", exp);
            localStorage.setItem("clickPower", clickPower);
            localStorage.setItem("autoCps", autoCps);
            localStorage.setItem("crystals", crystals);
            localStorage.setItem("lastLeave", Date.now());
            localStorage.setItem("maxOfflineHours", maxOfflineHours);
            localStorage.setItem("boughtIds", JSON.stringify(boughtIds));
            localStorage.setItem("usedPromos", JSON.stringify(usedPromos));
        }

        function updateUI() {
            document.getElementById("exp-counter").innerText = formatNum(exp) + " XP";
            document.getElementById("click-power").innerText = `👆 Клик: +${formatNum(clickPower)}`;
            document.getElementById("cps-view").innerText = `⚙️ Авто: ${formatNum(autoCps)}/с`;
            document.getElementById("crystals-view").innerText = `💎 Алмазы: ${formatNum(crystals)}`;
            renderShops();
            saveLocal();
        }

        function tap() { exp += clickPower; updateUI(); }

        function usePromo() {
            const input = document.getElementById("promo-code");
            const code = input.value.trim().toUpperCase();
            if (usedPromos.includes(code)) {
                alert("❌ Код уже использован!");
            } else if (promoCodes[code]) {
                const reward = promoCodes[code];
                exp += reward;
                usedPromos.push(code);
                alert(`🎉 Код активирован! Получено +${formatNum(reward)} XP!`);
                updateUI();
            } else {
                alert("❌ Неверный код!");
            }
            input.value = "";
        }

        function renderShops() {
            const cContainer = document.getElementById("click-shop"); cContainer.innerHTML = "";
            clickUpgrades.forEach(item => {
                const btn = document.createElement("button"); btn.className = "shop-btn";
                btn.innerHTML = `<span>${item.name}</span><span class="cost">${formatNum(item.cost)} XP</span>`;
                btn.disabled = exp < item.cost;
                btn.onclick = () => { if(exp >= item.cost) { exp -= item.cost; clickPower += item.power; updateUI(); } };
                cContainer.appendChild(btn);
            });

            const aContainer = document.getElementById("auto-shop"); aContainer.innerHTML = "";
            autoUpgrades.forEach(item => {
                const isBought = boughtIds.includes(item.id);
                const btn = document.createElement("button"); btn.className = "shop-btn";
                btn.innerHTML = `<span>${item.name}</span><span class="cost">${isBought ? "КУПЛЕНО" : formatNum(item.cost) + " XP"}</span>`;
                btn.disabled = isBought || exp < item.cost;
                btn.onclick = () => {
                    if(exp >= item.cost && !isBought) {
                        exp -= item.cost;
                        boughtIds.push(item.id);
                        if(item.time) maxOfflineHours = item.time;
                        else autoCps += item.cps;
                        updateUI();
                    }
                };
                aContainer.appendChild(btn);
            });
        }

        setInterval(() => { if (autoCps > 0) { exp += autoCps; updateUI(); } }, 1000);
        setInterval(() => {
            tg.sendData(JSON.stringify({
                action: "save", exp, clickPower, autoCps, crystals, maxOfflineHours, boughtIds, usedPromos
            }));
        }, 5000);

        updateUI();
    </script>
</body>
</html>
