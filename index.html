<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ CyberTap ⚡</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-grad: radial-gradient(circle at 50% 50%, #121225 0%, #070712 100%);
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.1);
        }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg-grad);
            color: #ffffff; text-align: center; margin: 0; padding: 12px; user-select: none;
        }
        .daily-box {
            background: linear-gradient(90deg, #ff007f 0%, #7928ca 100%);
            border-radius: 14px; padding: 8px; margin-bottom: 12px;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
        }
        .daily-btn {
            background: #ffffff; color: #000; border: none; width: 100%; padding: 10px;
            border-radius: 10px; font-weight: 900; font-size: 13px; cursor: pointer;
        }
        .daily-btn:disabled { opacity: 0.6; background: #ccc; cursor: not-allowed; }

        .stats-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
        .stat-card {
            background: var(--card-bg); border: 1px solid var(--card-border); padding: 8px 4px;
            border-radius: 12px; font-size: 11px; font-weight: 700;
        }
        #click-power { color: #00f2fe; }
        #cps-view { color: #ff007f; }
        #reforge-view { color: #ff9900; }

        .counter { font-size: 34px; font-weight: 900; margin: 8px 0; color: #00ff87; word-break: break-all; }
        .tap-btn {
            width: 120px; height: 120px; border-radius: 50%; border: none;
            background: radial-gradient(circle at 30% 30%, #00f2fe 0%, #4facfe 100%); color: white;
            font-size: 16px; font-weight: 800; cursor: pointer; box-shadow: 0 0 25px rgba(0, 242, 254, 0.4);
            margin: 5px auto; display: block;
        }
        .tap-btn:active { transform: scale(0.92); }
        .save-btn {
            background: #00ff87; color: #000; border: none; width: 100%; padding: 12px;
            border-radius: 12px; font-weight: 900; margin-top: 10px; cursor: pointer; font-size: 13px;
        }
        .promo-box { background: var(--card-bg); border: 1px solid var(--card-border); padding: 8px; border-radius: 12px; margin: 10px 0; display: flex; gap: 8px; }
        .promo-input { flex: 1; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--card-border); border-radius: 8px; color: #fff; padding: 8px; text-align: center; font-weight: bold; }
        .promo-btn { background: #00f2fe; color: #000; border: none; border-radius: 8px; font-weight: 800; padding: 0 12px; cursor: pointer; }
        
        .shop-section { margin-top: 12px; text-align: left; }
        .shop-title { font-size: 12px; font-weight: bold; color: #a5b4fc; margin-bottom: 6px; }
        .shop-grid { display: flex; flex-direction: column; gap: 6px; max-height: 22vh; overflow-y: auto; }
        .shop-btn {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06); color: white;
            padding: 8px; font-size: 11px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center;
        }
        .shop-btn .cost { color: #00ff87; font-weight: bold; }
        .shop-btn .reforge-cost { color: #ff9900; font-weight: bold; }
        .shop-btn:disabled { opacity: 0.3; }
    </style>
</head>
<body>

    <!-- ЕЖЕДНЕВНЫЙ БОНУС В САМОМ ВЕРХУ -->
    <div class="daily-box">
        <button class="daily-btn" id="daily-reward-btn" onclick="claimDailyReward()">🎁 Забрать бонус</button>
    </div>

    <div class="stats-container">
        <div class="stat-card" id="click-power">👆 Клик: +1</div>
        <div class="stat-card" id="cps-view">⚙️ Авто: 0/с</div>
        <div class="stat-card" id="reforge-view">🔥 Опыт: 0</div>
    </div>

    <div class="counter" id="crystals-counter">0 💎</div>
    <button class="tap-btn" onclick="tap()">💎 АЛМАЗ</button>
    
    <button class="save-btn" onclick="sendSaveToBot(true)">💾 СОХРАНИТЬ В БОТА</button>

    <div class="promo-box">
        <input type="text" id="promo-code" class="promo-input" placeholder="ПРОМОКОД..." />
        <button class="promo-btn" onclick="usePromo()">ВВОД</button>
    </div>

    <div class="shop-section">
        <div class="shop-title">👆 ПРОКАЧКА КЛИКА</div>
        <div class="shop-grid" id="click-shop"></div>
    </div>

    <div class="shop-section">
        <div class="shop-title">📦 АВТО-ТАПЕРЫ & СУНДУКИ</div>
        <div class="shop-grid" id="auto-shop"></div>
    </div>

    <div class="shop-section">
        <div class="shop-title">🔥 УЛУЧШЕНИЯ ПЕРЕЗАКАЛКИ</div>
        <div class="shop-grid" id="reforge-shop"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp; 
        tg.expand();
        tg.ready();
        
        let crystals = Number(localStorage.getItem("crystals")) || 0;
        let clickPower = Number(localStorage.getItem("clickPower")) || 1;
        let autoCps = Number(localStorage.getItem("autoCps")) || 0;
        let reforgeExp = Number(localStorage.getItem("reforgeExp")) || 0;
        let maxOfflineHours = Number(localStorage.getItem("maxOfflineHours")) || 1;
        let boughtIds = JSON.parse(localStorage.getItem("boughtIds") || "[]");
        let usedPromos = JSON.parse(localStorage.getItem("usedPromos") || "[]");
        let dailyDay = Number(localStorage.getItem("dailyDay")) || 1;
        let lastDailyClaim = Number(localStorage.getItem("lastDailyClaim")) || 0;

        const promoCodes = {
            "PROMOKOD": 100, "PROCLIKER": 100, "BONUS100": 100, "GEMSTART": 100, "LUCKY100": 100,
            "SILVERPASS": 1000, "MEGASECRET": 1000, "SUPERGEM2026": 1000,
            "GOLDENKING": 10000, "CYBERLEGEND2026": 100000
        };

        const clickUpgrades = [
            { id: 101, name: "Клик +1", cost: 50, power: 1 },
            { id: 102, name: "Клик +5", cost: 250, power: 5 },
            { id: 103, name: "Клик +25", cost: 1250, power: 25 },
            { id: 104, name: "Клик +100", cost: 5000, power: 100 }
        ];

        const autoUpgrades = [
            { id: 1, name: "Палка (+10/с)", cost: 100, cps: 10 },
            { id: 2, name: "Ручка (+50/с)", cost: 500, cps: 50 },
            { id: 8, name: "Офлайн 2 часа", cost: 1000, cps: 0, time: 2 },
            { id: 16, name: "Офлайн 4 часа", cost: 50000, cps: 0, time: 4 },
            { id: 999, name: "⚡ Нано-кликер (+50/с)", cost: 15000, cps: 50, isInfinite: true },
            { id: 10, name: "🤖 Робо-рука (+1 000/с)", cost: 100000, cps: 1000 },
            { id: 11, name: "💻 Серверная ферма (+2 500/с)", cost: 250000, cps: 2500 },
            { id: 12, name: "🌐 Нейросеть (+5 500/с)", cost: 500000, cps: 5500 },
            { id: 13, name: "🚀 Кибер-спутник (+12 000/с)", cost: 1000000, cps: 12000 },
            { id: 14, name: "🌌 Квантовый сервер (+30 000/с)", cost: 2500000, cps: 30000 },
            { id: 15, name: "🔮 Матрица Данных (+65 000/с)", cost: 5000000, cps: 65000 },
            { id: 17, name: "🪐 Планетарный Бур (+100 000/с)", cost: 7500000, cps: 100000 },
            { id: 18, name: "👑 Галактический Тапер (+160 000/с)", cost: 10000000, cps: 160000 },
            { id: 777, name: "🎰 Квантовый Сундук Удачи", cost: 1500000, isLootbox: true }
        ];

        const reforgeUpgrades = [
            { id: 201, name: "💤 Офлайн кликер до 24 часов", cost: 10, type: "offline24" },
            { id: 202, name: "🛡️ Сохранение 5% дохода при перезакалке", cost: 20, type: "keep5pct" }
        ];

        function formatNum(num) { return num.toLocaleString('ru-RU'); }

        function calculateDailyReward(day) {
            return day <= 10 ? (100 + (day - 1) * 50) : (1000 + (day - 11) * 500);
        }

        function checkDailyStatus() {
            const btn = document.getElementById("daily-reward-btn");
            const now = Date.now();
            const oneDayMs = 24 * 60 * 60 * 1000;
            const rewardAmount = calculateDailyReward(dailyDay);

            if (now - lastDailyClaim >= oneDayMs) {
                btn.disabled = false;
                btn.innerText = `🎁 Забрать бонус: День ${dailyDay} (+${formatNum(rewardAmount)} 💎)`;
            } else {
                btn.disabled = true;
                const hoursLeft = Math.ceil((oneDayMs - (now - lastDailyClaim)) / (1000 * 60 * 60));
                btn.innerText = `⏳ Бонус День ${dailyDay} через ${hoursLeft}ч`;
            }
        }

        function claimDailyReward() {
            const now = Date.now();
            const oneDayMs = 24 * 60 * 60 * 1000;
            if (now - lastDailyClaim >= oneDayMs) {
                const rewardAmount = calculateDailyReward(dailyDay);
                crystals += rewardAmount;
                lastDailyClaim = now;
                alert(`🎉 Вы получили бонус за День ${dailyDay}: +${formatNum(rewardAmount)} 💎!`);
                dailyDay++;
                updateUI();
                sendSaveToBot();
            }
        }

        function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

        function openLootbox() {
            let rand = Math.random() * 100;
            let rewardCrystals = rand < 90 ? getRandomInt(1000, 5000) : (rand < 98.9 ? getRandomInt(5001, 30000) : getRandomInt(30001, 100000));
            crystals += rewardCrystals;
            alert(`🎰 Выиграно +${formatNum(rewardCrystals)} 💎!`);
        }

        function sendSaveToBot(showAlert = false) {
            const dataObj = {
                action: "save", crystals, clickPower, autoCps, maxOfflineHours, boughtIds, usedPromos, reforgeExp, dailyDay, lastDailyClaim
            };
            try {
                tg.sendData(JSON.stringify(dataObj));
                if (showAlert) alert("✅ Прогресс сохранен!");
            } catch(e) {
                if (showAlert) alert("❌ Ошибка сохранения");
            }
        }

        function saveLocal() {
            localStorage.setItem("crystals", crystals);
            localStorage.setItem("clickPower", clickPower);
            localStorage.setItem("autoCps", autoCps);
            localStorage.setItem("reforgeExp", reforgeExp);
            localStorage.setItem("maxOfflineHours", maxOfflineHours);
            localStorage.setItem("boughtIds", JSON.stringify(boughtIds));
            localStorage.setItem("usedPromos", JSON.stringify(usedPromos));
            localStorage.setItem("dailyDay", dailyDay);
            localStorage.setItem("lastDailyClaim", lastDailyClaim);
        }

        function updateUI() {
            document.getElementById("crystals-counter").innerText = formatNum(crystals) + " 💎";
            document.getElementById("click-power").innerText = `👆 Клик: +${formatNum(clickPower)}`;
            document.getElementById("cps-view").innerText = `⚙️ Авто: ${formatNum(autoCps)}/с`;
            document.getElementById("reforge-view").innerText = `🔥 Опыт: ${formatNum(reforgeExp)}`;
            checkDailyStatus();
            renderShops();
            saveLocal();
        }

        function tap() { crystals += clickPower; updateUI(); }

        function usePromo() {
            const input = document.getElementById("promo-code");
            const code = input.value.trim().toUpperCase();
            if (usedPromos.includes(code)) {
                alert("❌ Код уже использован!");
            } else if (promoCodes[code]) {
                const reward = promoCodes[code];
                crystals += reward;
                usedPromos.push(code);
                alert(`🎉 Получено +${formatNum(reward)} 💎!`);
                updateUI();
                sendSaveToBot();
            } else {
                alert("❌ Неверный код!");
            }
            input.value = "";
        }

        function renderShops() {
            const cContainer = document.getElementById("click-shop"); cContainer.innerHTML = "";
            clickUpgrades.forEach(item => {
                const btn = document.createElement("button"); btn.className = "shop-btn";
                btn.innerHTML = `<span>${item.name}</span><span class="cost">${formatNum(item.cost)} 💎</span>`;
                btn.disabled = crystals < item.cost;
                btn.onclick = () => { if(crystals >= item.cost) { crystals -= item.cost; clickPower += item.power; updateUI(); } };
                cContainer.appendChild(btn);
            });

            const aContainer = document.getElementById("auto-shop"); aContainer.innerHTML = "";
            autoUpgrades.forEach(item => {
                const isBought = boughtIds.includes(item.id);
                const btn = document.createElement("button"); btn.className = "shop-btn";
                let costText = (!item.isInfinite && !item.isLootbox && isBought) ? "КУПЛЕНО" : formatNum(item.cost) + " 💎";
                btn.innerHTML = `<span>${item.name}</span><span class="cost">${costText}</span>`;
                btn.disabled = (!item.isInfinite && !item.isLootbox && isBought) || crystals < item.cost;
                btn.onclick = () => {
                    if (crystals >= item.cost) {
                        crystals -= item.cost;
                        if (item.isLootbox) openLootbox();
                        else if (item.isInfinite) autoCps += item.cps;
                        else {
                            boughtIds.push(item.id);
                            if (item.time) maxOfflineHours = item.time;
                            else autoCps += item.cps;
                        }
                        updateUI();
                    }
                };
                aContainer.appendChild(btn);
            });

            const rContainer = document.getElementById("reforge-shop"); rContainer.innerHTML = "";
            reforgeUpgrades.forEach(item => {
                const isBought = boughtIds.includes(item.id);
                const btn = document.createElement("button"); btn.className = "shop-btn";
                btn.innerHTML = `<span>${item.name}</span><span class="reforge-cost">${isBought ? "КУПЛЕНО" : item.cost + " 🔥 EXP"}</span>`;
                btn.disabled = isBought || reforgeExp < item.cost;
                btn.onclick = () => {
                    if(reforgeExp >= item.cost && !isBought) {
                        reforgeExp -= item.cost;
                        boughtIds.push(item.id);
                        if(item.type === "offline24") maxOfflineHours = 24;
                        updateUI();
                    }
                };
                rContainer.appendChild(btn);
            });
        }

        setInterval(() => { if (autoCps > 0) { crystals += autoCps; updateUI(); } }, 1000);

        updateUI();
    </script>
</body>
</html>
